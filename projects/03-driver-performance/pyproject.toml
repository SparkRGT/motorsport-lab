
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-performance-engineer"
version = "0.1.0"
description = "Evidence-based driver performance analysis for EA SPORTS F1 25 telemetry."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "f1-telemetry-analyzer==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
